[project]
name = "imdb-portfolio"
version = "0.1.0"
description = "A local film research workflow with Scrapy, Flask, spreadsheet exports, and PDF reports"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "LicenseRef-Proprietary"
dependencies = [
    "flask>=3.1,<4.0",
    "scrapy>=2.13,<3.0",
    "pandas>=2.2,<3.0",
    "numpy>=2.0,<3.0",
    "fnc>=0.5,<1.0",
    "jinja2>=3.1,<4.0",
    "xhtml2pdf>=0.2.17,<0.3",
    "openpyxl>=3.1,<4.0",
    "pyyaml>=6.0,<7.0",
    "gunicorn>=26.2,<27.0; sys_platform != 'win32'",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=9.1,<10.0"
ruff = ">=0.16,<1.0"
pip = ">=26.2,<27.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "single"

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"
